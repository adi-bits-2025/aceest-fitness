<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ACEest Fitness & Gym{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; margin: 0; }
    header { background: #d4af37; color: #000; padding: 16px 24px; }
    header a { color: #000; text-decoration: none; font-size: 22px; font-weight: bold; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    section { background: #262626; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    h2 { color: #d4af37; margin-top: 0; font-size: 18px; }
    a { color: #d4af37; }
    label { display: block; margin: 6px 0 2px; font-size: 14px; }
    input, select { padding: 6px; width: 100%; max-width: 320px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 14px; background: #d4af37; border: 0; cursor: pointer; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #444; }
    pre { white-space: pre-wrap; margin: 0; }
    .flash { padding: 10px; border-radius: 4px; margin-bottom: 12px; }
    .flash.ok { background: #1f4d2b; }
    .flash.error { background: #5c1f1f; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">ACEest Fitness &amp; Gym</a></header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
